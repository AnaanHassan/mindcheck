/* Layout: one calm centred column, a soft progress bar on top, one question at a time. */
:root{
  --bg:#eef5f4; --surface:#ffffff; --soft:#e2efed; --line:#d3e3e1; --fg:#1c2c2e; --muted:#5e7275;
  --accent:#2a8a83; --accent-hi:#237770; --accent-soft:#dcefec; --on-accent:#ffffff;
  --ok:#3c9465; --mild:#b98a1c; --mod:#c46a35; --sev:#c24848; --sev-soft:#fbecec; --logo-n:#045276; --logo-t:#03b7bb;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1c; --surface:#162426; --soft:#1c2e31; --line:#25393c; --fg:#e6efee; --muted:#93a8aa;
  --accent:#6cc2b8; --accent-hi:#86d0c7; --accent-soft:#1d3735; --on-accent:#0c1a1b;
  --ok:#7ccb9c; --mild:#e3c169; --mod:#ec9c6c; --sev:#f08585; --sev-soft:#2c1b1d; --logo-n:#d3e8ee; --logo-t:#3ccbcd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1c; --surface:#162426; --soft:#1c2e31; --line:#25393c; --fg:#e6efee; --muted:#93a8aa;
  --accent:#6cc2b8; --accent-hi:#86d0c7; --accent-soft:#1d3735; --on-accent:#0c1a1b;
  --ok:#7ccb9c; --mild:#e3c169; --mod:#ec9c6c; --sev:#f08585; --sev-soft:#2c1b1d; --logo-n:#d3e8ee; --logo-t:#3ccbcd; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
/* Soft, calm colour wash behind everything. A fixed layer, because iOS ignores background-attachment:fixed. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 45% at 85% 0%,var(--accent-soft),transparent 70%),radial-gradient(55% 40% at 0% 100%,var(--glow),transparent 70%)}
:root{--glow:#e6eefb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glow:#16222f}}
:root[data-theme="dark"]{--glow:#16222f}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--muted)}
.brand .dot{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.brand .dot i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.progress{display:flex;flex-direction:column;gap:8px}
.progress .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .35s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:40px;display:flex;flex-direction:column;gap:24px;box-shadow:0 1px 2px rgba(20,50,50,.04),0 8px 28px rgba(20,50,50,.06)}
@media (max-width:540px){.card{padding:26px 20px;border-radius:20px}}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:40px;line-height:1.1}
h2{font-size:27px;line-height:1.25}
@media (max-width:540px){h1{font-size:32px}h2{font-size:23px}}
p{margin:0}
.lead{font-size:19px;color:var(--muted);max-width:56ch}
.muted{color:var(--muted)}
.small{font-size:15px}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:540px){.facts{gap:8px}.fact{padding:12px 10px;border-radius:14px}.fact b{font-size:16px!important;line-height:1.3}.fact span{font-size:13px!important;line-height:1.35}}
.fact{background:var(--soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:2px}
.fact b{font-family:var(--display);font-weight:600;font-size:18px}
.fact span{font-size:15px;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:17px;padding:15px 30px;border-radius:99px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;transition:background .15s,transform .15s}
.btn:active{transform:scale(.98)}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:16px;font-weight:600;cursor:pointer;min-height:44px;padding:10px 14px;margin-inline-start:-14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px}
.link:active{color:var(--fg);background:var(--soft)}
/* Hover styles only on devices with a real mouse. On phones, hover "sticks" to whatever
   is under the finger, so the next question's option would look pre-selected. */
@media (hover:hover){
  .btn:hover{background:var(--accent-hi)}
  .link:hover{color:var(--fg)}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn.outline:hover{background:var(--accent-soft)}
  .expo:hover,footer .expo-foot a:hover{text-decoration:underline}
}
html[dir="rtl"] .arr{display:inline-block;transform:scaleX(-1)}
#start{width:100%}
@media (min-width:541px){#start{width:auto;min-width:220px}}
.btn:focus-visible,.link:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stem{font-size:16px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:600;color:var(--fg);
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;min-height:60px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt .r{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:border-color .15s}
.opt .r i{width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .15s}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .r{border-color:var(--accent)}
.opt.sel .r i{transform:scale(1)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:540px){.scores{grid-template-columns:minmax(0,1fr)}}
.score{background:var(--soft);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.score .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.score .num{font-family:var(--display);font-weight:600;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score .num small{font-family:var(--body);font-size:15px;font-weight:600;color:var(--muted)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:currentColor}
.tag{align-self:flex-start;font-size:14px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface);color:currentColor}
.c0{color:var(--ok)}.c1{color:var(--mild)}.c2{color:var(--mod)}.c3,.c4{color:var(--sev)}
.urgent{background:var(--sev-soft);border:2px solid var(--sev);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
.urgent h2{color:var(--sev);font-size:23px}
.help{background:var(--accent-soft);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.numbers{display:flex;gap:28px;flex-wrap:wrap}
.numbers div{display:flex;flex-direction:column}
.numbers{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px!important;max-width:420px}
.numbers a{display:flex;flex-direction:column;text-decoration:none;color:inherit;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.numbers a:active{transform:scale(.98)}
.numbers b{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;display:flex;align-items:center;gap:8px}
.numbers b svg{width:20px;height:20px;flex:none;color:var(--accent)}
.urgent .numbers b svg{color:var(--sev)}
.numbers span{font-size:14px;color:var(--muted)}
/* Guided breathing (opens from the "Try slow breathing" idea) */
.try{align-self:flex-start;margin-top:6px;font:inherit;font-size:15px;font-weight:700;color:var(--accent);background:var(--surface);border:2px solid var(--accent);border-radius:99px;padding:9px 18px;min-height:44px;cursor:pointer}
.try:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0 6px}
.breath .ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.breath .ball{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent));transform:scale(1);transition:transform 4s ease-in-out}
.breath .ball.big{transform:scale(2.3)}
.breath .cue{font-family:var(--display);font-size:22px;font-weight:600;color:var(--fg);min-height:1.6em;text-align:center}
.breath .secs{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.recs li{display:flex;flex-direction:column;gap:4px;padding:18px 20px;border:1px solid var(--line);border-radius:16px}
.recs li b{font-family:var(--display);font-weight:600;font-size:18px}
.recs li p{color:var(--muted);max-width:60ch}
.recs li.main{background:var(--accent-soft);border-color:transparent}
.recs li.main p{color:var(--fg)}
footer{text-align:center;font-size:14px;color:var(--muted);padding-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn.outline{background:transparent;color:var(--accent);border:2px solid var(--accent);padding:13px 26px}
.print-only{display:none}
@media print{
  :root{--bg:#fff;--surface:#fff;--soft:#f1f6f5;--line:#cfdcdb;--fg:#111;--muted:#444;--accent:#1f6f69;--accent-soft:#eaf4f3;--ok:#2b7a50;--mild:#8a6610;--mod:#9e4d1f;--sev:#a02c2c;--sev-soft:#fbeeee;--logo-n:#045276;--logo-t:#03b7bb;color-scheme:light}

  .actions,#progress,.brand,.try,.breath{display:none!important}
  body::before{display:none}
  .numbers a{border:0;padding:0;background:none}
  .print-only{display:block}
  .recs li,.score,.help,.urgent{break-inside:avoid}
  h1{font-size:24pt!important}
  .lead{font-size:12pt!important}
  @page{margin:16mm}
}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;background:var(--soft);border-radius:99px;padding:4px;gap:2px}
.lang button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:99px;padding:6px 14px;min-height:40px;background:transparent;color:var(--muted);cursor:pointer}

const N=19;
let lang="en", A=new Array(N).fill(null), i=0, busy=false, screen="intro";
try{const s=localStorage.getItem("mindcheck-lang");if(s==="dv"||s==="en")lang=s}catch(e){}
const $=id=>document.getElementById(id);
const L=()=>S[lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function question(k){
  const t=L();
  if(k<9)return{s:0,stem:t.often,t:t.phq[k],o:t.freq};
  if(k<16)return{s:1,stem:t.often,t:t.gad[k-9],o:t.freq};
  const h=t.habits[k-16];return{s:2,stem:h.stem,t:h.t,o:h.o};
}

function setLang(l){
  lang=l;
  try{localStorage.setItem("mindcheck-lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.documentElement.dir=l==="dv"?"rtl":"ltr";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=L()[el.dataset.t]);
  document.title=L().brand;
  if(screen==="quiz")render();
  if(screen==="result")results();
}

function show(id){screen=id;["intro","quiz","result"].forEach(s=>$(s).hidden=s!==id);$("progress").hidden=id!=="quiz";window.scrollTo(0,0)}

/* Browser history: each question gets its own entry, so the Android back button
   and iPhone swipe-back go to the previous question instead of leaving the site. */
function nav(st,replace){try{history[replace?"replaceState":"pushState"](st,"")}catch(e){}}
function firstGap(){const k=A.indexOf(null);return k<0?N:k}
function apply(st){
  stopBreath();
  st=st||{s:"intro"};
  if(st.s==="quiz"){i=Math.max(0,Math.min(st.i|0,firstGap(),N-1));show("quiz");render()}
  else if(st.s==="result"&&firstGap()===N){results();show("result")}
  else show("intro");
}
window.addEventListener("popstate",e=>{busy=false;apply(e.state)});

function render(){
  const q=question(i);
  if(window.scrollY>0)window.scrollTo(0,0);
  $("psec").textContent=L().sec[q.s];
  $("pnum").textContent=L().count(i+1,N);
  $("bar").style.width=Math.round(i/N*100)+"%";
  $("qstem").textContent=q.stem;
  $("qtext").textContent=q.t;
  const qb=$("qbody");qb.classList.remove("fade");void qb.offsetWidth;qb.classList.add("fade");
  const box=$("opts");box.innerHTML="";
  q.o.forEach((label,v)=>{
    const b=document.createElement("button");
    b.className="opt"+(A[i]===v?" sel":"");b.id="opt-"+v;
    b.setAttribute("role","radio");b.setAttribute("aria-checked",A[i]===v);
    b.innerHTML='<span class="r"><i></i></span><span></span>';
    b.lastChild.textContent=label;
    b.onclick=()=>answer(v);
    box.appendChild(b);
  });
}
function answer(v){
  if(busy)return;busy=true;
  A[i]=v;
  document.querySelectorAll(".opt").forEach((b,k)=>{b.classList.toggle("sel",k===v);b.setAttribute("aria-checked",k===v)});
  setTimeout(()=>{
    if(!busy)return; // user navigated away mid-animation
    busy=false;
    if(i<N-1){i++;nav({s:"quiz",i});render();try{$("qtext").focus({preventScroll:true})}catch(e){}}
    else{nav({s:"result"});results()}
  },220);
}

/* Guided 4-4-6 breathing, about 2 minutes */
let breathT=null;
function stopBreath(){if(breathT){clearTimeout(breathT);breathT=null}}
function breathe(btn){
  const box=btn.parentElement.querySelector(".breath"), t=L();
  if(breathT){stopBreath();box.hidden=true;btn.textContent=t.tryNow;return}
  box.hidden=false;btn.textContent=t.stop;
  const ball=box.querySelector(".ball"), cue=box.querySelector(".cue"), secs=box.querySelector(".secs");
  const steps=[[t.bIn,4,true],[t.bHold,4,true],[t.bOut,6,false]];
  let k=0,round=0,left=0;
  const tick=()=>{
    if(left<=0){
      if(k===0&&round===8){cue.textContent=t.bDone;secs.textContent="";ball.classList.remove("big");breathT=null;btn.textContent=t.tryNow;return}
      const [txt,sec,big]=steps[k];
      cue.textContent=txt;left=sec;ball.style.transitionDuration=sec+"s";ball.classList.toggle("big",big);
      k=(k+1)%3;if(k===0)round++;
    }
    secs.textContent=t.secs(left);left--;
    breathT=setTimeout(tick,1000);
  };
  tick();
  box.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function band(score,cuts){let k=0;cuts.forEach((c,j)=>{if(score>=c)k=j+1});return k}

function results(){
  stopBreath();
  const t=L();
  const phq=A.slice(0,9).reduce((a,b)=>a+b,0), gad=A.slice(9,16).reduce((a,b)=>a+b,0);
  const item9=A[8], sleep=A[16], move=A[17], talk=A[18];
  const pk=band(phq,[5,10,15,20]), gk=band(gad,[5,10,15]);
  const top=Math.max(pk,gk===3?4:gk);
  const head=t.heads[Math.min(top,3)];

  const card=(name,tool,score,max,k,label)=>'<div class="score c'+k+'"><div class="top"><span class="small muted" style="font-weight:700">'+name+'</span><span class="small muted" dir="ltr">'+tool+'</span></div>'+
    '<div class="num" style="color:var(--fg)">'+score+' <small>'+esc(t.outOf(max))+'</small></div>'+
    '<div class="meter"><i style="width:'+Math.max(4,score/max*100)+'%"></i></div><span class="tag">'+label+'</span></div>';

  const R=t.r, recs=[];
  recs.push(top>=3?R.sev:top===2?R.mod:top===1?R.mild:R.min);
  if(sleep<=1)recs.push(R.sleepShort);
  if(sleep===3)recs.push(R.sleepLong);
  if(move<=1)recs.push(R.move);
  if(talk<=1)recs.push(R.talk);
  if(gk>=1)recs.push(R.breathe);
  if(pk>=1)recs.push(R.plan);
  if(top===0)recs.push(R.others);

  const now=new Date();
  const ph='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  const nums=(long)=>'<div class="numbers"><a href="tel:1677"><b dir="ltr">'+ph+'1677</b><span>'+t.line1677+'</span></a><a href="tel:119"><b dir="ltr">'+ph+'119</b><span>'+(long?t.line119:t.line119s)+'</span></a></div><p class="small muted" style="margin-top:-4px">'+t.tapCall+'</p>';
  let h='<div class="print-only"><div class="label">'+t.brand+'</div><p class="small muted">'+t.completed+' <span dir="ltr">'+now.toLocaleDateString(t.locale,{day:'numeric',month:'long',year:'numeric'})+', '+now.toLocaleTimeString(t.locale,{hour:'2-digit',minute:'2-digit'})+'</span></p></div>';
  if(item9>0) h+='<div class="urgent" role="alert"><h2>'+t.urgentH+'</h2><p>'+t.urgentP+'</p>'+nums(true)+'<p class="small">'+t.urgentF+'</p></div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px"><span class="label">'+t.results+'</span><h1 class="rh">'+head[0]+'</h1><p class="lead" style="font-size:18px">'+head[1]+'</p></div>';
  h+='<div class="scores">'+card(t.mood,"PHQ-9",phq,27,pk,t.phqBands[pk])+card(t.worry,"GAD-7",gad,21,gk,t.gadBands[gk])+'</div>';
  h+='<div style="display:flex;flex-direction:column;gap:12px"><h2 class="ih">'+t.ideas+'</h2><ul class="recs">'+
    recs.map((r,k)=>'<li'+(k===0?' class="main"':'')+'><b>'+r[0]+'</b><p>'+r[1]+'</p>'+
      (r===R.breathe?'<button class="try" id="try">'+t.tryNow+'</button><div class="breath" hidden aria-live="polite"><div class="ring"><div class="ball"></div></div><div class="cue"></div><div class="secs" dir="ltr"></div></div>':'')+
      '</li>').join("")+'</ul></div>';
  if(item9===0) h+='<div class="help"><b style="font-family:var(--display);font-size:18px">'+t.helpH+'</b><p class="small">'+t.helpP+'</p>'+nums(false)+'</div>';
  h+='<p class="small muted">'+t.disclaimer+'</p>';
  h+='<div class="actions">'+(window.self===window.top?'<button class="btn outline" id="print">'+t.print+'</button>':'')+'<button class="link" id="review">'+t.change+'</button></div>';
  h+='<p class="print-only small muted">'+t.printFoot+'</p>';
  $("result").innerHTML=h;
  if($("print"))$("print").onclick=()=>window.print();
  if($("try"))$("try").onclick=e=>breathe(e.currentTarget);
  $("review").onclick=()=>{i=0;nav({s:"quiz",i:0});show("quiz");render()};
  if(screen!=="result")show("result");
}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$("start").onclick=()=>{i=0;nav({s:"quiz",i:0});show("quiz");render()};
$("back").onclick=()=>{
  busy=false;
  const st=history.state;
  if(st&&st.s==="quiz"&&history.length>1){history.back();return}
  if(i>0){i--;render()}else show("intro");
};
nav({s:"intro"},true);
document.addEventListener("keydown",e=>{
  if($("quiz").hidden)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4)answer(n-1);
});
setLang(lang);
</script>
</body>
</html>
